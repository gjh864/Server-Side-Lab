spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

  ai:
    alibaba:
      dashscope:
        api-key: ${AI_DASHSCOPE_API_KEY}
        chat:
          options:
            model: qwen-turbo

security:
  jwt:
    secret: demo-jwt-secret-key-for-spring-security-2026
    expiration-millis: 7200000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true